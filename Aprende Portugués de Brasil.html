const reg=(e,inf,es,pe)=>{
 const t=inf.slice(-2), s=inf.slice(0,-2), ar=t==="ar";
 const eu=!ar?s+"i":s.endsWith("c")?s.slice(0,-1)+"quei":s.endsWith("g")?s+"uei":s.endsWith("ç")?s.slice(0,-1)+"cei":s+"ei";
 return [e,inf,es,
  [pe||s+"o",s+(ar?"a":"e"),s+(ar?"a":t==="er"?"e":"i")+"mos",s+(ar?"am":"em")],
  [eu,s+(ar?"ou":t==="er"?"eu":"iu"),s+(ar?"a":t==="er"?"e":"i")+"mos",s+(ar?"aram":t==="er"?"eram":"iram")],
  [inf+"ei",inf+"á",inf+"emos",inf+"ão"]];
};

 <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">`+
 Object.keys(d).map(k=>`
   <button onclick="go({theme:'${k}',mode:'lista',i:0,flip:false,quiz:null,open:null})" class="group p-5 rounded-3xl bg-white border border-slate-100 hover:border-emerald-400 hover:shadow-xl transition-all duration-300 text-left flex flex-col justify-between relative overflow-hidden">
     <div class="absolute -right-4 -bottom-4 text-7xl opacity-5 group-hover:scale-110 transition-transform duration-300">${d[k][0][0]}</div>
     <div>
       <span class="text-4xl block mb-3 group-hover:scale-110 transition-transform origin-left">${d[k][0][0]}</span>
       <h3 class="font-bold text-slate-800 group-hover:text-emerald-700 text-base">${k}</h3>
     </div>
     <div class="text-xs font-medium text-slate-400 mt-3 flex items-center gap-1">
       <span>${d[k].length} ${isV?'verbos':'palabras'}</span>
       <span class="group-hover:translate-x-1 transition-transform">→</span>
     </div>
   </button>`).join("")+`</div>`;
}

function conj(v){
 const p=["eu (yo)","você/ele/ela (usted/él/ella)","nós (nosotros)","vocês/eles/elas (ustedes/ellos)"];
 const T=[["Presente",3],["Pretérito Perfeito",4],["Futuro do Presente",5]];
 return `
 <div class="mt-4 overflow-x-auto rounded-2xl border border-emerald-100 bg-emerald-50/40 p-1">
   <table class="w-full text-xs sm:text-sm text-left">
     <thead>
       <tr class="text-emerald-900 border-b border-emerald-100 bg-emerald-100/50">
         <th class="p-2.5 font-bold">Persona</th>
         ${T.map(t=>`<th class="p-2.5 font-bold">${t[0]}</th>`).join("")}
       </tr>
     </thead>
     <tbody class="divide-y divide-emerald-100/60">
       ${p.map((x,j)=>`
         <tr class="hover:bg-white/60 transition-colors">
           <td class="p-2.5 font-medium text-slate-600">${x}</td>
           ${T.map(t=>`<td class="p-2.5 font-bold text-emerald-800">${v[t[1]][j]}</td>`).join("")}
         </tr>`).join("")}
     </tbody>
   </table>
 </div>`;
}

function modeBar(){
 return `
 <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-100 mb-6 flex flex-col sm:flex-row items-center justify-between gap-3">
   <div class="flex items-center gap-3 w-full sm:w-auto">
     <button onclick="go({theme:null,open:null})" class="p-2.5 rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-600 transition-colors">←</button>
     <div>
       <span class="text-xs text-slate-400 uppercase tracking-wider font-bold block">Tema seleccionado</span>
       <h2 class="font-extrabold text-slate-800 text-lg">${S.theme}</h2>
     </div>
   </div>
   <div class="flex items-center gap-1.5 w-full sm:w-auto justify-end bg-slate-100 p-1 rounded-xl">
     ${[["lista","📋 Lista"],["cards","🃏 Flashcards"],["examen","✏️ Examen"]].map(([k,l])=>`<button onclick="go({mode:'${k}',i:0,flip:false,quiz:null,open:null})" class="flex-1 sm:flex-none px-4 py-2 rounded-lg text-xs font-bold transition-all ${S.mode===k?'bg-white text-emerald-700 shadow-sm':'text-slate-600 hover:text-slate-900'}">${l}</button>`).join("")}
   </div>
 </div>`;
}

function lista(){
 const v=S.tab==="verbos";
 return `
 <div class="grid gap-3 sm:grid-cols-2">`+
 items().map((w,n)=>`
   <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition-all">
     <div class="flex items-center gap-4">
       <div class="w-14 h-14 rounded-2xl bg-emerald-50 flex items-center justify-center text-3xl shadow-inner flex-shrink-0">${w[0]}</div>
       <div class="flex-1 min-w-0">
         <div class="font-extrabold text-emerald-800 text-lg tracking-tight truncate">${w[1]}</div>
         <div class="text-slate-500 text-sm font-medium truncate">${w[2]}</div>
       </div>
       ${v?`<button onclick="go({open:S.open===${n}?null:${n}})" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-800 hover:bg-emerald-200 transition-colors">${S.open===n?'Ocultar':'Conjugar'}</button>`:''}
     </div>
     ${v&&S.open===n?conj(w):''}
   </div>`).join("")+`</div>`;
}

function cards(){
 const L=items(), w=L[S.i], v=S.tab==="verbos";
 return `
 <div class="max-w-md mx-auto">
   <div class="flex justify-between items-center text-xs font-bold text-slate-400 mb-3 px-1">
     <span>Tarjeta ${S.i+1} de ${L.length}</span>
     <span>Pulsa la tarjeta para girar</span>
   </div>
   
   <div class="flip h-72 cursor-pointer select-none" onclick="go({flip:!S.flip})">
     <div class="fi h-full ${S.flip?'on':''}">
       <!-- FRENTE -->
       <div class="face bg-white border-2 border-emerald-100 p-6 text-center">
         <span class="text-7xl mb-4 animate-bounce">${w[0]}</span>
         <span class="text-3xl font-extrabold text-emerald-800">${w[1]}</span>
         <span class="text-xs text-slate-400 mt-2 font-medium">🇧🇷 Portugués de Brasil</span>
       </div>
       <!-- REVERSO -->
       <div class="face back bg-gradient-to-br from-teal-700 to-emerald-800 text-white p-6 text-center">
         <span class="text-xs uppercase tracking-widest text-emerald-200 font-bold mb-1">Traducción al español</span>
         <span class="text-4xl font-extrabold mb-2">${w[2]}</span>
         <span class="text-xs text-emerald-200/80 mt-2">Toca de nuevo para volver</span>
       </div>
     </div>
   </div>

   <div class="flex items-center justify-center gap-3 mt-5">
     <button class="${sec}" onclick="go({i:(S.i-1+${L.length})%${L.length},flip:false,open:null})">← Anterior</button>
     <button class="${pri}" onclick="go({flip:!S.flip})">Girar tarjeta</button>
     <button class="${sec}" onclick="go({i:(S.i+1)%${L.length},flip:false,open:null})">Siguiente →</button>
   </div>

   ${v?`
     <div class="mt-6 text-center">
       <button class="w-full py-2.5 rounded-2xl bg-emerald-50 text-emerald-800 font-bold text-sm border border-emerald-200 hover:bg-emerald-100 transition-colors" onclick="go({open:S.open==='c'?null:'c'})">
         ${S.open==='c'?'Ocultar conjugaciones completas':'✨ Ver todas las conjugaciones de este verbo'}
       </button>
     </div>
     ${S.open==='c'?conj(w):''}
   `:''}
 </div>`;
}

function examen(){
 const L=items(), v=S.tab==="verbos";
 if(!S.quiz)S.quiz={n:0,ok:0,res:[],fb:null};
 const q=S.quiz;

 if(q.n>=L.length){
  const pct=Math.round(q.ok/L.length*100);
  let msg="¡Excelente trabajo!";
  if(pct<50)msg="¡Sigue practicando, tú puedes!";
  else if(pct<80)msg="¡Muy bien hecho!";

  return `
  <div class="max-w-md mx-auto bg-white rounded-3xl p-8 text-center shadow-xl border border-slate-100">
    <div class="text-6xl mb-3">${pct>=70?'🎉':'💪'}</div>
    <h3 class="text-2xl font-extrabold text-slate-800">Resultados del Examen</h3>
    <div class="text-4xl font-extrabold text-emerald-600 my-3">${q.ok} / ${L.length} <span class="text-lg font-medium text-slate-400">(${pct}%)</span></div>
    <p class="text-sm text-slate-600 mb-6 font-medium">${msg}</p>

    <div class="space-y-2 text-left max-h-48 overflow-y-auto mb-6 pr-1">
      ${q.res.map(r=>`
        <div class="p-3 rounded-xl border text-xs flex items-center justify-between ${r.ok?'bg-emerald-50 border-emerald-200 text-emerald-900':'bg-rose-50 border-rose-200 text-rose-900'}">
          <span class="font-bold">${r.e}</span>
          <span>${r.ok?'✅ Correcto':`Escribiste: <b>${r.a||'vacío'}</b> (Era: <b>${r.c}</b>)`}</span>
        </div>`).join("")}
    </div>

    <button class="${pri} w-full justify-center" onclick="go({quiz:null})">🔄 Repetir examen</button>
  </div>`;
 }

 const w=L[q.n];
 return `
 <div class="max-w-md mx-auto">
   <div class="flex justify-between items-center text-xs font-bold text-slate-400 mb-3 px-1">
     <span>Pregunta ${q.n+1} de ${L.length}</span>
     <span class="text-emerald-600">Aciertos: ${q.ok}</span>
   </div>

   <div class="bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100">
     <div class="text-8xl mb-4 animate-pulse">${w[0]}</div>
     <span class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold mb-2">Traducción: ${w[2]}</span>
     <p class="text-slate-500 text-xs font-medium mb-4">${v?'Escribe el verbo en infinitivo (sin tildes ni acentos si prefieres)':'Escribe la palabra en portugués'}</p>

     ${q.fb?`
       <div class="p-4 rounded-2xl mb-4 ${q.fb.ok?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-rose-50 text-rose-800 border border-rose-200'}">
         <p class="font-bold text-base">${q.fb.ok?'¡Correcto! 🎉':'¡Incorrecto! ❌'}</p>
         ${!q.fb.ok?`<p class="text-xs mt-1">La respuesta correcta era: <b class="underline text-sm">${w[1]}</b></p>`:''}
       </div>
       <button class="${pri} w-full justify-center" onclick="next()">Siguiente pregunta →</button>
     `:`
       <div class="space-y-3">
         <input id="ans" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full border-2 border-slate-200 focus:border-emerald-500 rounded-2xl px-4 py-3.5 text-center text-xl font-bold text-slate-800 focus:outline-none transition-colors" placeholder="Escribe en portugués..." onkeydown="if(event.key==='Enter')check()">
         <button class="${pri} w-full justify-center" onclick="check()">Comprobar respuesta</button>
       </div>
     `}
   </div>
 </div>`;
}

function check(){
 const inputVal=$("ans").value;
 const w=items()[S.quiz.n];
 const ok=norm(inputVal)===norm(w[1]);
 S.quiz.fb={ok};
 S.quiz.res.push({ok,a:inputVal,c:w[1],e:w[0]});
 if(ok)S.quiz.ok++;
 render();
}

function next(){
 S.quiz.n++;
 S.quiz.fb=null;
 render();
}

function frases(){
 const tabs=`
 <div class="flex gap-2 mb-6 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 max-w-md mx-auto">
   <button class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all ${S.sub==='gir'?'bg-emerald-600 text-white shadow':'text-slate-600 hover:bg-slate-50'}" onclick="go({sub:'gir',open:null})">🇧🇷 Gírias y Modismos</button>
   <button class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all ${S.sub==='sur'?'bg-emerald-600 text-white shadow':'text-slate-600 hover:bg-slate-50'}" onclick="go({sub:'sur',open:null})">✈️ Frases de Supervivencia</button>
 </div>`;

 if(S.sub==="gir"){
  return tabs+`
  <div class="mb-4 text-center">
    <h2 class="text-2xl font-extrabold text-slate-800">Expresiones y Modismos Brasileños</h2>
    <p class="text-sm text-slate-500 mt-1">Toca cualquier modismo para descubrir su contexto cultural en Brasil.</p>
  </div>
  <div class="grid gap-3 sm:grid-cols-2">`+
  SLANG.map(([p,e,c],n)=>`
    <div onclick="go({open:S.open===${n}?null:${n}})" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:border-emerald-300 transition-all cursor-pointer">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-extrabold text-emerald-800 text-lg">${p}</h3>
          <p class="text-sm font-semibold text-slate-600">${e}</p>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 font-bold">${S.open===n?'Ocultar':'Ver contexto'}</span>
      </div>
      ${S.open===n?`<p class="text-xs text-slate-600 mt-3 pt-3 border-t border-slate-100 leading-relaxed font-medium">💬 ${c}</p>`:''}
    </div>`).join("")+`</div>`;
 }

 return tabs+`
 <div class="mb-4 text-center">
   <h2 class="text-2xl font-extrabold text-slate-800">Frases Prácticas por Situación</h2>
   <p class="text-sm text-slate-500 mt-1">Útiles para desenvolverte desde el primer día en tu viaje o charla por internet.</p>
 </div>
 <div class="space-y-6">`+
 Object.entries(SURV).map(([k,a])=>`
   <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
     <h3 class="font-extrabold text-emerald-800 text-base mb-3 flex items-center gap-2"><span>📌</span> ${k}</h3>
     <div class="space-y-2">
       ${a.map(([p,e])=>`
         <div class="p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50/50 transition-colors border border-slate-100">
           <div class="font-bold text-slate-800 text-sm">🇧🇷 ${p}</div>
           <div class="text-xs text-slate-500 font-medium mt-0.5">🇪🇸 ${e}</div>
         </div>`).join("")}
     </div>
   </div>`).join("")+`</div>`;
}

function render(){
 nav();
 let h="";
 if(S.tab==="frases")h=frases();
 else{
  const d=S.tab==="vocab"?THEMES:VERBS;
  if(!S.theme)h=themeMenu(d);
  else h=modeBar()+(S.mode==="lista"?lista():S.mode==="cards"?cards():examen());
 }
 $("app").innerHTML=h;
 const a=$("ans");
 if(a)a.focus();
}

render();
</script>
</body>
</html>
