:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:'Plus Jakarta Sans',sans-serif;background:linear-gradient(135deg,#f0fdf4 0%,#f0f9ff 100%);color:#0f291e;min-height:100vh}
.flip{perspective:1000px}
.fi{position:relative;transition:transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);transform-style:preserve-3d}
.fi.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:1.75rem;box-shadow:0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.05)}
.back{transform:rotateY(180deg)}
/* Custom scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}

/* Game canvas container styles */
.rain-box {
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #1e293b, #0f172a);
  border-radius: 1.5rem;
  height: 380px;
}
.falling-word {
  position: absolute;
  transform: translateX(-50%);
  transition: top 0.05s linear;
  white-space: nowrap;
  user-select: none;
}
@keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
.cd{animation:pop .5s ease-out}
@media (prefers-reduced-motion:reduce){.cd{animation:none}}
</style>

const tyNew=t=>({t,st:0,last:0,err:0,keys:0,done:null});
function tySet(t){S.ty=tyNew(t);render()}
function tipo(){
 if(!S.ty)S.ty=tyNew(0);
 const lv={"Fácil":"bg-emerald-100 text-emerald-800","Medio":"bg-amber-100 text-amber-800","Difícil":"bg-rose-100 text-rose-800"};
 return `<div class="max-w-2xl mx-auto">
 <div class="mb-5 text-center"><h2 class="text-2xl font-extrabold text-slate-800">Mecanografía en portugués</h2>
 <p class="text-sm text-slate-500 mt-1">Escribe el texto sin preocuparte por tildes, cedillas ni signos: con las letras correctas basta (ã = a, ç = c).</p></div>
 <div class="flex flex-wrap gap-2 justify-center mb-4">${TY.map((x,i)=>`<button onclick="tySet(${i})" class="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${S.ty.t===i?'bg-emerald-600 text-white border-emerald-600 shadow':'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}">Texto ${i+1} <span class="ml-1 px-1.5 py-0.5 rounded-full ${lv[x[0]]}">${x[0]}</span></button>`).join("")}</div>
 <div id="tyshow" class="bg-white rounded-3xl p-5 sm:p-6 shadow-sm border border-slate-100 text-lg sm:text-xl leading-relaxed font-medium break-words"></div>
 <textarea id="tyin" rows="3" oninput="tyUpdate()" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Empieza a escribir aquí..." class="w-full mt-4 border-2 border-slate-200 focus:border-emerald-500 rounded-2xl px-4 py-3 text-base focus:outline-none transition-colors"></textarea>
 <div id="tystat" class="mt-4"></div></div>`;
}
function tyInit(){tyUpdate();const e=$("tyin");if(e&&!S.ty.done)e.focus()}
function tyUpdate(){
 const T=TY[S.ty.t][1], e=$("tyin"), ks=[...T].map(nk), target=ks.join("");
 let tv=[...e.value].map(nk).join("").replace(/^ +/,"").replace(/ {2,}/g," ");
 if(S.ty.done){tv=target}
 if(!S.ty.st&&tv.length)S.ty.st=Date.now();
 if(!S.ty.done&&tv.length>S.ty.last){S.ty.keys+=tv.length-S.ty.last;if(tv.length<=target.length&&tv[tv.length-1]!==target[tv.length-1])S.ty.err++}
 S.ty.last=tv.length;
 let j=0,out="";
 [...T].forEach((c,i)=>{
  const k=ks[i],ch=c===" "?"&nbsp;":c.replace("&","&amp;").replace("<","&lt;");
  if(k===""){out+=`<span class="${j<tv.length?'text-slate-700':'text-slate-300'}">${ch}</span>`;return}
  if(j<tv.length){const ok=tv[j]===k;out+=`<span class="${ok?'text-emerald-600':'text-rose-600 bg-rose-100 rounded'}">${ch}</span>`}
  else if(j===tv.length)out+=`<span class="bg-yellow-200 text-slate-800 rounded">${ch}</span>`;
  else out+=`<span class="text-slate-300">${ch}</span>`;
  j++;
 });
 $("tyshow").innerHTML=out;
 if(!S.ty.done&&tv.length>=target.length&&tv.slice(0,target.length)===target){S.ty.done={ms:Date.now()-S.ty.st};e.disabled=true}
 const D=S.ty.done, mins=D?Math.max(D.ms/60000,0.01):0;
 const acc=S.ty.keys?Math.round((S.ty.keys-S.ty.err)/S.ty.keys*100):100;
 $("tystat").innerHTML=`<div class="flex flex-wrap items-center justify-between gap-3 bg-white rounded-2xl p-3 border border-slate-100 text-sm">
  <span class="font-bold text-slate-500">Progreso: <b class="text-emerald-700">${Math.min(100,Math.round(tv.length/target.length*100))}%</b></span>
  <span class="font-bold text-slate-500">Precisión: <b class="text-emerald-700">${acc}%</b></span>
  <span class="font-bold text-slate-500">Errores: <b class="text-rose-600">${S.ty.err}</b></span>
  ${D?`<span class="font-bold text-slate-500">Tiempo: <b class="text-emerald-700">${(D.ms/1000).toFixed(1)} s</b></span><span class="font-bold text-slate-500">Velocidad: <b class="text-emerald-700">${Math.round(target.length/5/mins)} ppm</b></span>`:''}
  <span class="flex gap-2"><button class="${sec} !py-1.5 !px-3 text-xs" onclick="tySet(S.ty.t)">🔄 Reiniciar</button><button class="${pri} !py-1.5 !px-3 text-xs" onclick="tySet((S.ty.t+1)%TY.length)">Siguiente texto →</button></span></div>
  ${D?`<p class="text-center mt-3 font-bold text-emerald-700">🎉 ¡Texto completado!</p>`:''}`;
}

const QN=10,QP=10;
const qzMk=()=>({qs:shuf(QZ).slice(0,QN).map(x=>({q:x[0],c:x[1],o:shuf(x.slice(1,5)),e:x[5]})),i:0,score:0,pick:null,done:false});

 }

 const bar=Math.round((z.i+(ans?1:0))/tot*100);
 return `<div class="max-w-xl mx-auto">

  <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-5 sm:p-7">
   <h3 class="text-lg sm:text-xl font-extrabold text-slate-800 mb-5 leading-snug">${q.q}</h3>

    let cls="border-slate-200 bg-white hover:border-emerald-400 hover:bg-emerald-50 text-slate-700",ic="";
    if(ans){if(t===q.c){cls="border-emerald-500 bg-emerald-50 text-emerald-800";ic="✅"}else if(n===z.pick){cls="border-rose-500 bg-rose-50 text-rose-800";ic="❌"}else cls="border-slate-100 bg-slate-50 text-slate-400"}
    return `<button ${ans?'disabled':''} onclick="qzPick(${n})" class="w-full text-left px-4 py-3.5 rounded-2xl border-2 font-semibold transition-all active:scale-[.98] flex items-center justify-between gap-3 ${cls}"><span class="flex items-center gap-3"><span class="w-7 h-7 shrink-0 rounded-lg bg-black/5 text-xs flex items-center justify-center font-bold">${"ABCD"[n]}</span>${t}</span><span>${ic}</span></button>`}).join("")}</div>
   ${ans?`<div class="mt-5 p-4 rounded-2xl text-sm font-medium ${hit?'bg-emerald-50 text-emerald-900 border border-emerald-200':'bg-rose-50 text-rose-900 border border-rose-200'}"><p class="font-extrabold mb-1">${hit?'Correto! 🎉 +'+QP+' pontos':'Quase! A resposta certa é: '+q.c}</p><p>${q.e}</p></div>

// ===== MINIJUEGO 1: CHUVA DE PALAVRAS =====
const RP=[{speed:.5,spawn:3200,lives:5,max:1.4},{speed:.8,spawn:2200,lives:3,max:2.2},{speed:1.1,spawn:1600,lives:3,max:2.8}];
function rainInit(){
 const p=RP[G.diff];
 S.rain={score:0,hit:0,lives:p.lives,words:[],active:true,paused:false,speed:p.speed,max:p.max,spawnRate:p.spawn,lastSpawn:0,pool:gamePool(),rec:false};
 render();rainStartLoop();
}
function rainStartLoop(){
 clearGameIntervals();
 S.rainLoop=setInterval(()=>{
  const r=S.rain;
  if(!r||!r.active||r.paused)return;
  const now=Date.now();
  if(now-r.lastSpawn>r.spawnRate){
   const free=r.pool.filter(p=>!r.words.some(w=>w.pt===p.pt));
   const it=(free.length?free:r.pool)[Math.floor(Math.random()*(free.length||r.pool.length))];
   r.words.push({emoji:it.emoji,pt:it.pt,es:it.es,x:Math.floor(Math.random()*70)+15,y:0});
   r.lastSpawn=now;
   if(r.speed<r.max)r.speed+=0.015;
   if(r.spawnRate>900)r.spawnRate-=20;
  }
  for(let i=r.words.length-1;i>=0;i--){
   const w=r.words[i];w.y+=r.speed;
   if(w.y>=90){
    r.lives--;r.words.splice(i,1);
    if(r.lives<=0){r.active=false;r.rec=setHS('rain',r.score);clearGameIntervals();}
   }
  }
  rainRenderUI();
 },50);
}
function rainCheckInput(val){
 const r=S.rain;
 if(!r||!r.active||r.paused)return;
 const c=norm(val);
 if(!c)return;
 const idx=r.words.findIndex(w=>norm(w.pt)===c);
 if(idx!==-1){

  r.score+=10;r.hit++;r.words.splice(idx,1);
  const el=$("rainInput");if(el)el.value="";
  rainRenderUI();
 }
}

const TT=[90,60,40];
function timerInit(){
 S.timer={score:0,streak:0,ok:0,total:TT[G.diff],timeLeft:TT[G.diff],words:shuf(gamePool()),idx:0,active:true,rec:false};
 render();timerStartLoop();
}
function timerStartLoop(){
 clearGameIntervals();
 S.timerLoop=setInterval(()=>{
  const t=S.timer;
  if(!t||!t.active)return;
  t.timeLeft--;
  if(t.timeLeft<=0){t.timeLeft=0;t.active=false;t.rec=setHS('timer',t.score);clearGameIntervals();timerRenderUI();}
  else timerTick();
 },1000);
}
function timerTick(){
 const t=S.timer,e=$("tmTime"),b=$("tmBar");
 if(e){e.textContent='⏳ '+t.timeLeft+'s';e.className='text-2xl font-extrabold '+(t.timeLeft<=10?'text-rose-600':'text-slate-800');}
 if(b)b.style.width=(t.timeLeft/t.total*100)+'%';
}
function timerAdvance(){
 const t=S.timer;t.idx=(t.idx+1)%t.words.length;
 timerRenderUI();
}
function timerCheckInput(val){
 const t=S.timer;
 if(!t||!t.active)return;
 const cur=t.words[t.idx];
 if(norm(val)===norm(cur.pt)){
  say(cur.pt);
  t.streak++;t.ok++;
  t.score+=100+Math.min(t.streak*10,50);
  timerAdvance();
 }
}
function timerSkip(){
 const t=S.timer;
 if(!t||!t.active)return;
 t.streak=0;timerAdvance();
}
function timerRenderUI(){
 const box=$("timerBox"),t=S.timer;
 if(!box||!t)return;
 if(!t.active){box.innerHTML=endCard('⏱️','¡Tempo Esgotado!',t.score,'puntos',t.rec,getHS('timer'),t.ok+' palabras acertadas');return;}
 const c=t.words[t.idx];
 box.innerHTML=`<div class="bg-white rounded-3xl p-6 sm:p-8 text-center shadow-xl border border-slate-100">
  <div class="flex items-center justify-between mb-3">
   <div class="text-left"><span class="text-xs font-bold text-slate-400 block">Tiempo</span>

   <div><span class="text-xs font-bold text-slate-400 block">Racha</span><span class="text-2xl font-extrabold text-amber-500">🔥 x${t.streak}</span></div>
   <div class="text-right"><span class="text-xs font-bold text-slate-400 block">Puntos</span><span class="text-2xl font-extrabold text-emerald-600">⭐ ${t.score}</span></div>

  <div class="text-6xl mb-3">${c.emoji}</div>
  <span class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold mb-1">${c.cat}</span>
  <h3 class="text-2xl font-extrabold text-slate-800 mb-6">${c.es}</h3>
  <div class="flex gap-2">
   <input id="timerInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Escribe en portugués..." oninput="timerCheckInput(this.value)" class="flex-1 min-w-0 border-2 border-slate-200 focus:border-emerald-500 rounded-2xl px-4 py-3 text-center font-bold text-xl text-slate-800 focus:outline-none transition-colors">
   <button onclick="timerSkip()" class="${sec} text-xs !px-4">Pular ⏭️</button>

function timerView(){

// ===== MINIJUEGO 3: ADIVINHA A PALAVRA =====
const GT=[8,6,4];
function guessInit(){
 S.guess={pool:shuf(gamePool()),idx:0,score:0,solved:0,max:GT[G.diff],revealed:new Set(),triesLeft:GT[G.diff],status:'playing',rec:false};
 guessSetupWord();render();
}
function guessSetupWord(){
 const g=S.guess,word=g.pool[g.idx].pt;
 g.revealed=new Set();
 [...word].forEach(c=>{if(!/[a-zA-Zà-úÀ-ÚçÇ]/.test(c))g.revealed.add(norm(c));});
 g.triesLeft=g.max;g.status='playing';
}
function guessWin(pts){
 const g=S.guess;
 g.status='won';g.score+=pts;g.solved++;
 if(setHS('guess',g.score))g.rec=true;
 say(g.pool[g.idx].pt);
}
function guessLetter(letter){
 const g=S.guess;
 if(!g||g.status!=='playing')return;
 const l=norm(letter);
 if(g.revealed.has(l))return;
 g.revealed.add(l);
 const word=g.pool[g.idx].pt,t=[...word].map(c=>norm(c));
 if(!t.includes(l)){g.triesLeft--;if(g.triesLeft<=0)g.status='lost';}
 else if(t.every(c=>g.revealed.has(c)))guessWin(50+g.triesLeft*10);
 render();
}
function guessSolve(val){
 const g=S.guess;
 if(!g||g.status!=='playing'||!val.trim())return;
 if(norm(val)===norm(g.pool[g.idx].pt))guessWin(100);
 else{g.triesLeft-=2;if(g.triesLeft<=0){g.triesLeft=0;g.status='lost';}}
 render();
}
function guessNext(){
 const g=S.guess;
 g.idx=(g.idx+1)%g.pool.length;
 guessSetupWord();render();
}
document.addEventListener('keydown',e=>{
 if(S.tab!=='jogos'||G.game!=='guess'||G.phase!=='play'||!S.guess)return;
 if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(S.guess.status==='playing'&&/^[a-z]$/i.test(e.key))guessLetter(e.key);
 else if(S.guess.status!=='playing'&&e.key==='Enter')guessNext();
});
function guessView(){
 const g=S.guess,cur=g.pool[g.idx],target=[...cur.pt];
 const alpha="abcdefghijklmnopqrstuvwxyz".split("");
 const word=target.map(c=>{
  if(c===" ")return `<span class="w-4"></span>`;
  if(g.revealed.has(norm(c))||g.status!=='playing')
   return `<span class="w-8 sm:w-9 h-11 border-b-4 ${g.status==='lost'&&!g.revealed.has(norm(c))?'border-rose-400 text-rose-600':'border-emerald-600 text-emerald-800'} font-extrabold text-2xl flex items-center justify-center">${c}</span>`;
  return `<span class="w-8 sm:w-9 h-11 border-b-4 border-slate-300 bg-slate-100 rounded-t-md"></span>`;
 }).join("");
 const over=g.status!=='playing';
 return `<div class="max-w-md mx-auto">
  <div class="text-center mb-4"><h2 class="text-2xl font-extrabold text-slate-800">🧩 Adivinha a Palavra</h2>
  <p class="text-sm text-slate-500 mt-1">Pulsa letras o escribe la palabra completa.</p></div>
  <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 text-center">
   <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100 text-xs font-extrabold">
    <span class="text-rose-600">Vidas: ${'❤️'.repeat(Math.max(0,g.triesLeft))}</span>
    <span class="text-slate-500">Acertadas: ${g.solved}</span>
    <span class="text-emerald-700">Puntos: ⭐ ${g.score}</span>
   </div>
   <div class="text-6xl mb-2">${cur.emoji}</div>
   <span class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold mb-1">Pista: ${cur.es}</span>
   <p class="text-xs text-slate-400 mb-5 font-medium">${cur.cat}</p>
   <div class="flex justify-center flex-wrap gap-1.5 mb-6 select-none">${word}</div>
   ${!over?`
    <div class="flex flex-wrap justify-center gap-1.5 mb-5">${alpha.map(l=>{const u=g.revealed.has(l);
     return `<button ${u?'disabled':''} onclick="guessLetter('${l}')" class="w-8 h-9 rounded-xl font-bold text-sm transition-all ${u?'bg-slate-100 text-slate-300':'bg-slate-50 hover:bg-emerald-100 text-slate-700 border border-slate-200 active:scale-95'}">${l.toUpperCase()}</button>`}).join("")}</div>
    <div class="flex gap-2">
     <input id="guessInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="¿Sabes la palabra completa?" onkeyup="if(event.key==='Enter')guessSolve(this.value)" class="flex-1 min-w-0 border-2 border-slate-200 focus:border-emerald-500 rounded-2xl px-3 py-2 text-sm font-bold text-slate-800 focus:outline-none">
     <button onclick="guessSolve($('guessInput').value)" class="${pri} !py-2 !px-4 text-xs">Resolver</button>
    </div>`:`
    <div class="p-4 rounded-2xl mb-4 ${g.status==='won'?'bg-emerald-50 border border-emerald-200 text-emerald-800':'bg-rose-50 border border-rose-200 text-rose-800'}">
     <p class="font-extrabold">${g.status==='won'?'🎉 ¡Excelente! Lo adivinaste.':'❌ Sin vidas restantes.'}</p>
     <p class="text-xs mt-1">${g.status==='won'?'Era':'La respuesta era'}: <b class="text-sm underline">${cur.pt}</b>${g.rec&&g.status==='won'?' · 🏆 ¡Nuevo récord!':''}</p>
    </div>
    <button onclick="guessNext()" class="${pri} w-full justify-center">Siguiente palabra →</button>`}
  </div>
  <p class="text-center text-xs text-slate-400 font-medium mt-3">Récord (${DIFFS[G.diff]}): ${Math.max(getHS('guess'),g.score)}</p>
 </div>`;
}

        <div class="p-3 rounded-xl border text-xs flex items-center justify-between ${r.ok?'bg-emerald-50 border-emerald-200 text-emerald-900':'bg-rose-50 border-rose-200 text-rose-900'}">
          <span class="font-bold">${r.e}</span>
          <span>${r.ok?'✅ Correcto':`Escribiste: <b>${r.a||'vacío'}</b> (Era: <b>${r.c}</b>)`}</span>
        </div>`).join("")}
    </div>

    <button class="${pri} w-full justify-center" onclick="go({quiz:null})">🔄 Repetir examen</button>
  </div>`;
 }

 const w=L[q.n];
 return `
 <div class="max-w-md mx-auto">
   <div class="flex justify-between items-center text-xs font-bold text-slate-400 mb-3 px-1">
     <span>Pregunta ${q.n+1} de ${L.length}</span>
     <span class="text-emerald-600">Aciertos: ${q.ok}</span>
   </div>

   <div class="bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100">
     <div class="text-8xl mb-4 animate-pulse">${w[0]}</div>
     <span class="inline-block px-3 py-1 rounded-full bg-slate-100 text-slate-600 text-xs font-bold mb-2">Traducción: ${w[2]}</span>
     <p class="text-slate-500 text-xs font-medium mb-4">${v?'Escribe el verbo en infinitivo (sin tildes ni acentos si prefieres)':'Escribe la palabra en portugués'}</p>

     ${q.fb?`
       <div class="p-4 rounded-2xl mb-4 ${q.fb.ok?'bg-emerald-50 text-emerald-800 border border-emerald-200':'bg-rose-50 text-rose-800 border border-rose-200'}">
         <p class="font-bold text-base">${q.fb.ok?'¡Correcto! 🎉':'¡Incorrecto! ❌'}</p>
         ${!q.fb.ok?`<p class="text-xs mt-1">La respuesta correcta era: <b class="underline text-sm">${w[1]}</b></p>`:''}
       </div>
       <button class="${pri} w-full justify-center" onclick="next()">Siguiente pregunta →</button>
     `:`
       <div class="space-y-3">
         <input id="ans" autofocus autocomplete="off" autocapitalize="off" spellcheck="false" class="w-full border-2 border-slate-200 focus:border-emerald-500 rounded-2xl px-4 py-3.5 text-center text-xl font-bold text-slate-800 focus:outline-none transition-colors" placeholder="Escribe en portugués..." onkeydown="if(event.key==='Enter')check()">
         <button class="${pri} w-full justify-center" onclick="check()">Comprobar respuesta</button>
       </div>
     `}
   </div>
 </div>`;
}

function check(){
 const inputVal=$("ans").value;
 const w=items()[S.quiz.n];
 const ok=norm(inputVal)===norm(w[1]);
 S.quiz.fb={ok};
 S.quiz.res.push({ok,a:inputVal,c:w[1],e:w[0]});
 if(ok)S.quiz.ok++;
 render();
}

function next(){
 S.quiz.n++;
 S.quiz.fb=null;
 render();
}

function frases(){
 const tabs=`
 <div class="flex gap-2 mb-6 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 max-w-md mx-auto">
   <button class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all ${S.sub==='gir'?'bg-emerald-600 text-white shadow':'text-slate-600 hover:bg-slate-50'}" onclick="go({sub:'gir',open:null})">🇧🇷 Gírias y Modismos</button>
   <button class="flex-1 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition-all ${S.sub==='sur'?'bg-emerald-600 text-white shadow':'text-slate-600 hover:bg-slate-50'}" onclick="go({sub:'sur',open:null})">✈️ Frases de Supervivencia</button>
 </div>`;

 if(S.sub==="gir"){
  return tabs+`
  <div class="mb-4 text-center">
    <h2 class="text-2xl font-extrabold text-slate-800">Expresiones y Modismos Brasileños</h2>
    <p class="text-sm text-slate-500 mt-1">Toca cualquier modismo para descubrir su contexto cultural en Brasil.</p>
  </div>
  <div class="grid gap-3 sm:grid-cols-2">`+
  SLANG.map(([p,e,c],n)=>`
    <div onclick="go({open:S.open===${n}?null:${n}})" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:border-emerald-300 transition-all cursor-pointer">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-extrabold text-emerald-800 text-lg">${p}</h3>
          <p class="text-sm font-semibold text-slate-600">${e}</p>
        </div>
        <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 font-bold">${S.open===n?'Ocultar':'Ver contexto'}</span>
      </div>
      ${S.open===n?`<p class="text-xs text-slate-600 mt-3 pt-3 border-t border-slate-100 leading-relaxed font-medium">💬 ${c}</p>`:''}
    </div>`).join("")+`</div>`;
 }

 return tabs+`
 <div class="mb-4 text-center">
   <h2 class="text-2xl font-extrabold text-slate-800">Frases Prácticas por Situación</h2>
   <p class="text-sm text-slate-500 mt-1">Útiles para desenvolverte desde el primer día en tu viaje o charla por internet.</p>
 </div>
 <div class="space-y-6">`+
 Object.entries(SURV).map(([k,a])=>`
   <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-100">
     <h3 class="font-extrabold text-emerald-800 text-base mb-3 flex items-center gap-2"><span>📌</span> ${k}</h3>
     <div class="space-y-2">
       ${a.map(([p,e])=>`
         <div class="p-3 rounded-2xl bg-slate-50 hover:bg-emerald-50/50 transition-colors border border-slate-100">
           <div class="font-bold text-slate-800 text-sm">🇧🇷 ${p}</div>
           <div class="text-xs text-slate-500 font-medium mt-0.5">🇪🇸 ${e}</div>
         </div>`).join("")}
     </div>
   </div>`).join("")+`</div>`;
}

function render(){
 nav();
 let h="";
 if(S.tab==="tipo"){$("app").innerHTML=tipo();tyInit();return;}
 else if(S.tab==="quiz")h=quizTab();
 else if(S.tab==="frases")h=frases();
 else if(S.tab==="jogos")h=jogosTab();
 else{
  const d=S.tab==="vocab"?THEMES:VERBS;
  if(!S.theme)h=themeMenu(d);
  else h=modeBar()+(S.mode==="lista"?lista():S.mode==="cards"?cards():examen());
 }
 $("app").innerHTML=h;
 
 if(S.tab==="jogos" && G.phase==="play" && G.game==="rain"){
  rainRenderUI();
  const rInp=$("rainInput");
  if(rInp)rInp.focus();
 } else if(S.tab==="jogos" && G.phase==="play" && G.game==="timer"){
  timerRenderUI();
 } else {
  const a=$("ans");
  if(a)a.focus();
 }
}

render();
</script>
</body>
</html>
