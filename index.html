box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1d2621;--tx:#e6efe9;--mut:#93a39a;--pri:#4cc38a;--pri2:#223a2d;--bd:#2d3a33;--okbg:#1f4a30;--kobg:#552626;--ok:#6fdc9a;--ko:#ff8a8a}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1d2621;--tx:#e6efe9;--mut:#93a39a;--pri:#4cc38a;--pri2:#223a2d;--bd:#2d3a33;--okbg:#1f4a30;--kobg:#552626;--ok:#6fdc9a;--ko:#ff8a8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;padding:10px 12px;overflow-x:auto;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.logo{font-weight:800;color:var(--pri);margin-right:8px;white-space:nowrap}
nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:20px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pri);color:#fff}
main{max-width:900px;margin:0 auto;padding:20px 16px 40px}
h2{margin:.2em 0 .6em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-align:center;cursor:pointer;transition:.15s}
.card:hover{transform:translateY(-3px);border-color:var(--pri)}
.card .e{font-size:2.6rem}
.card small{color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.big{background:var(--acc);color:#3a2b00;margin-top:18px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.row .n{flex:1;color:var(--mut)}.row .p{flex:1;font-weight:700}
.spk{border:0;background:var(--pri2);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.1rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.reader{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-top:12px}
.reader .w{cursor:pointer;border-radius:4px;padding:0 1px}
.reader .w:hover{background:var(--acc);color:#3a2b00}
.reader .w.sel{background:var(--pri);color:#fff}
#tip{min-height:1.6em;color:var(--pri);font-weight:600}
.s-s{font-size:1rem}.s-m{font-size:1.25rem}.s-l{font-size:1.6rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:1.6rem;color:var(--pri)}
#target{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;font:1.25rem/1.8 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#target .ok{color:var(--ok);background:var(--okbg)}
#target .ko{color:var(--ko);background:var(--kobg)}
#target .cur{border-left:2px solid var(--acc);margin-left:-2px;animation:b 1s infinite}
@keyframes b{50%{border-color:transparent}}
textarea{width:100%;height:110px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px;font:1.05rem ui-monospace,Menlo,monospace;resize:vertical}
select{padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.hide{display:none}
.lang{display:flex;gap:12px;flex-wrap:wrap}
.lang .card{flex:1;min-width:150px}.lang .card.on{border-color:var(--pri);background:var(--pri2)}
.done{color:var(--ok);font-weight:700;margin-top:10px}
</style>
</head>

/* ============ VOZ (speechSynthesis pt-BR) ============ */
function speak(text){
  if(!("speechSynthesis" in window)) return alert("Tu navegador no soporta síntesis de voz.");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "pt-BR"; u.rate = .9;
  const v = speechSynthesis.getVoices().find(v => v.lang.replace("_","-") === "pt-BR");
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ============ NAVEGACIÓN ============ */
function renderNav(){
  const tabs = ["vocab","reader","typing","lang"];
  $("#nav").innerHTML = '<span class="logo">🇧🇷 PT-BR</span>' +
    tabs.map(t => `<button class="${state.tab===t?"on":""}" data-t="${t}">${tr(t)}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b => b.onclick = () => go(b.dataset.t));
}
function go(t){
  stopTimer(); speechSynthesis.cancel();
  state.tab = t; render();
}
function render(){
  renderNav();
  ({vocab:viewVocab, reader:viewReader, typing:viewTyping, lang:viewLang})[state.tab]();
  window.scrollTo(0,0);
}

/* ============ 1. VOCABULARIO ============ */
function viewVocab(){
  const m = $("#main");
  if(!state.cat){
    m.innerHTML = `<h2>${tr("cats")}</h2><div class="grid">` + APP_DATA.categories.map(c =>
      `<div class="card" data-id="${c.id}"><div class="e">${c.emoji}</div><b>${c.name[state.lang]}</b><br><small>${c.words.length} ${tr("words")}</small></div>`).join("") + "</div>";
    m.querySelectorAll(".card").forEach(c => c.onclick = () => { state.cat = c.dataset.id; render(); });
    return;
  }
  const c = APP_DATA.categories.find(x => x.id === state.cat);
  m.innerHTML = `<button class="btn alt" id="bk">${tr("back")}</button><h2>${c.emoji} ${c.name[state.lang]}</h2>` +
    c.words.map((w,i) => `<div class="row"><span class="n">${w[state.lang]}</span><span class="p">${w.pt}</span>
      <button class="spk" data-i="${i}" aria-label="🔊">🔊</button></div>`).join("");
  $("#bk").onclick = () => { state.cat = null; render(); };
  m.querySelectorAll(".spk").forEach(b => b.onclick = () => speak(c.words[b.dataset.i].pt));
}

/* ============ 2. LECTOR ============ */
function lookup(word){
  const w = word.toLowerCase().replace(/[.,;:!?]/g,"");
  for(const c of APP_DATA.categories) for(const x of c.words)
    if(x.pt.toLowerCase() === w || x.pt.toLowerCase().split(" ")[0] === w) return x[state.lang];
  return null;
}
function viewReader(){
  const m = $("#main");
  if(!state.text){
    m.innerHTML = `<h2>${tr("readT")}</h2><div class="grid">` + APP_DATA.texts.map(t =>
      `<div class="card" data-id="${t.id}"><div class="e">${t.emoji}</div><b>${t.title[state.lang]}</b></div>`).join("") + "</div>";
    m.querySelectorAll(".card").forEach(c => c.onclick = () => { state.text = c.dataset.id; render(); });
    return;
  }
  const t = APP_DATA.texts.find(x => x.id === state.text);
  const words = t.body.split(/(\s+)/).map(p => /\S/.test(p) ? `<span class="w">${p}</span>` : p).join("");
  m.innerHTML = `<button class="btn alt" id="bk">${tr("back")}</button><h2>${t.emoji} ${t.title[state.lang]}</h2>
    <div class="bar"><button class="btn" id="pl">${tr("play")}</button><button class="btn alt" id="st">${tr("stop")}</button>
    <label>${tr("size")}: <select id="sz"><option value="s">${tr("small")}</option><option value="m">${tr("medium")}</option><option value="l">${tr("large")}</option></select></label></div>
    <div id="tip">${tr("tip")}</div>
    <div class="reader s-${state.size}" id="rd">${words}</div>
    <button class="btn big" id="pr">⌨️ ${tr("practice")}</button>`;
  $("#sz").value = state.size;
  $("#sz").onchange = e => { state.size = e.target.value; $("#rd").className = "reader s-" + state.size; };
  $("#bk").onclick = () => { state.text = null; speechSynthesis.cancel(); render(); };
  $("#pl").onclick = () => speak(t.body);
  $("#st").onclick = () => speechSynthesis.cancel();
  $("#pr").onclick = () => { state.typingId = t.id; go("typing"); };
  $("#rd").querySelectorAll(".w").forEach(s => s.onclick = () => {
    $("#rd").querySelectorAll(".sel").forEach(x => x.classList.remove("sel"));
    s.classList.add("sel");
    const tl = lookup(s.textContent);
    $("#tip").textContent = s.textContent.replace(/[.,;:!?]/g,"") + (tl ? "  →  " + tl : "");
    speak(s.textContent.replace(/[.,;:!?]/g,""));
  });
}

/* ============ 3. MECANOGRAFÍA ============ */
function stopTimer(){ clearInterval(state.t.timer); state.t.timer = null; }
function viewTyping(){
  const m = $("#main");
  m.innerHTML = `<h2>⌨️ ${tr("typing")}</h2>
    <div class="bar"><label>${tr("pick")} <select id="ts">${APP_DATA.texts.map(t => `<option value="${t.id}">${t.title[state.lang]}</option>`).join("")}</select></label>
    <button class="btn alt" id="rs">↺ ${tr("restart")}</button></div>
    <div class="stats"><div class="stat"><b id="wpm">0</b>${tr("speed")}</div><div class="stat"><b id="ac">100%</b>${tr("acc")}</div><div class="stat"><b id="tm">0:00</b>${tr("time")}</div></div>
    <div id="target"></div><textarea id="inp" placeholder="${tr("ph")}" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><div id="dn"></div>`;
  $("#ts").value = state.typingId;
  $("#ts").onchange = e => { state.typingId = e.target.value; resetTyping(); };
  $("#rs").onclick = resetTyping;
  $("#inp").oninput = onType;
  resetTyping();
}
function resetTyping(){
  stopTimer(); state.t.start = null;
  $("#inp").value = ""; $("#inp").disabled = false;
  $("#wpm").textContent = "0"; $("#ac").textContent = "100%"; $("#tm").textContent = "0:00"; $("#dn").textContent = "";
  paint(""); $("#inp").focus();
}
function target(){ return APP_DATA.texts.find(t => t.id === state.typingId).body; }
function paint(typed){
  const tg = target();
  $("#target").innerHTML = [...tg].map((ch,i) => {
    let c = i < typed.length ? (typed[i] === ch ? "ok" : "ko") : (i === typed.length ? "cur" : "");
    return `<span class="${c}">${ch === " " && c === "ko" ? "·" : ch}</span>`;
  }).join("");
}
function onType(){
  const typed = $("#inp").value, tg = target();
  if(!state.t.start){
    state.t.start = Date.now();
    state.t.timer = setInterval(updateStats, 250);
  }
  paint(typed); updateStats();
  if(typed.length >= tg.length){
    stopTimer(); updateStats(); $("#inp").disabled = true; $("#dn").innerHTML = `<p class="done">${tr("done")}</p>`;
  }
}
function updateStats(){
  const typed = $("#inp").value, tg = target();
  const secs = state.t.start ? (Date.now() - state.t.start)/1000 : 0;
  let ok = 0; for(let i=0;i<typed.length;i++) if(typed[i]===tg[i]) ok++;
  const wpm = secs > 0 ? Math.round((ok/5)/(secs/60)) : 0;
  $("#wpm").textContent = wpm;
  $("#ac").textContent = (typed.length ? Math.round(ok/typed.length*100) : 100) + "%";
  $("#tm").textContent = Math.floor(secs/60) + ":" + String(Math.floor(secs%60)).padStart(2,"0");
}

/* ============ 4. IDIOMA NATIVO ============ */
function viewLang(){
  $("#main").innerHTML = `<h2>🌐 ${tr("langT")}</h2><p>${tr("langD")}</p><div class="lang">
    <div class="card ${state.lang==="es"?"on":""}" data-l="es"><div class="e">🇪🇸</div><b>Español</b></div>
    <div class="card ${state.lang==="en"?"on":""}" data-l="en"><div class="e">🇬🇧</div><b>English</b></div></div>`;
  document.querySelectorAll(".lang .card").forEach(c => c.onclick = () => {
    state.lang = c.dataset.l; document.documentElement.lang = state.lang; render();
  });
}

/* ============ INICIO ============ */
if("speechSynthesis" in window) speechSynthesis.getVoices();
render();
</script>
</body>
</html>
